# Local PostgreSQL for development. Start with `docker compose up -d` from the repo root.
# The password comes from `.env` (git-ignored); copy `.env.example` to create it.
services:
  db:
    image: postgres:18
    container_name: collecta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collecta
      POSTGRES_USER: collecta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>.
      - collecta-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collecta -d collecta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  collecta-db-data:
